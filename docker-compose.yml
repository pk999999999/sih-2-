services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jocky
      POSTGRES_USER: jocky
      POSTGRES_PASSWORD: jocky
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jocky"]
      interval: 5s
      timeout: 5s
      retries: 10

  objectstore:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: jocky
      AWS_SECRET_ACCESS_KEY: jocky-secret
      S3_BUCKET: evidence
    ports:
      - "8333:8333"
    volumes:
      - objectstore-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://jocky:jocky@postgres:5432/jocky
      STORAGE_BACKEND: s3
      BLOCKCHAIN_MOCK: ${BLOCKCHAIN_MOCK:-true}
      BLOCKCHAIN_MOCK_DB: /data/mock-chain.db
      BLOCKCHAIN_RPC_URL: http://ganache:8545
      BLOCKCHAIN_CONTRACT_ADDRESS: ${BLOCKCHAIN_CONTRACT_ADDRESS:-}
      BLOCKCHAIN_ACCOUNT: ${BLOCKCHAIN_ACCOUNT:-}
      BLOCKCHAIN_ABI_PATH: /app/blockchain/deployment.json
    volumes:
      - registry-data:/data
      - ./blockchain:/app/blockchain:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      JOCKY_API_URL: http://backend:8000
      JOCKY_AGENT_KEY: dev-agent-key
      JOCKY_AGENT_ID: demo-agent
    depends_on:
      - backend

  ganache:
    image: trufflesuite/ganache:v7.9.2
    command: ["--server.host", "0.0.0.0", "--chain.chainId", "1337", "--database.dbPath", "/data", "--wallet.deterministic"]
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - ganache-data:/data

volumes:
  postgres-data:
  objectstore-data:
  registry-data:
  ganache-data:
